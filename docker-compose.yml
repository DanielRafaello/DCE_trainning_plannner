services:
  backend:
    build:
      context: ./backend
      dockerfile: .devcontainer/Dockerfile
    container_name: app_backend
    ports:
      - "8080:80"
    volumes:
        # Application source code from host (src/, templates/, config/, ...)
        - ./backend:/app
        # Vhost Apache configuration
        - ./backend/docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf

        # Performance optimization for Windows: vendor/ and var/cache/ are overridden by anonymous volumes that live
        # inside Docker (Linux overlay FS). Without this, thousands of files on Windows FS and each stat()
        # over WSL2 bridge takes 1-3 ms → 10+ s per request.
        - /app/vendor
        - /app/var/cache

        #
        - ./docker-compose.yml:/app/docker-compose.yml
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: .devcontainer/Dockerfile
    container_name: app_frontend
    ports:
      - "5173:5173"
    volumes:
        # Application source code from host (src/, templates/, config/, ...)
        - ./frontend:/app
        - /app/node_modules
    depends_on:
      - backend
      - db


  db:
    image: postgres:18-alpine
    container_name: app_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Postgres creates POSTGRES_DB only on the very first start of an empty volume.
  # This one-shot service recreates the database on every `up` if it was dropped.
  db-init:
    image: postgres:18-alpine
    container_name: app_db_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: myapp
      PGPASSWORD: myapp
      POSTGRES_DB: myapp
    command: >
      sh -c "psql -d postgres -Atc \"SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB'\" | grep -q 1
      || psql -d postgres -c \"CREATE DATABASE $$POSTGRES_DB\""
    restart: "no"

    
  adminer:
    image: adminer
    container_name: app_adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db


volumes:
  db_data: